name: Setup Unity Project (Self-Hosted)
description: |
  セルフホストランナー向け Unity プロジェクトのセットアップ。
  チェックアウト、Unity バージョン検証、NuGet パッケージ復元を行う。
  後続ステップで使う UNITY_PATH を output として提供する。

inputs:
  unity-version:
    description: Unity Editor のバージョン
    required: true
  nuget-restore-method:
    description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列でスキップ）"
    required: false
    default: ""
  nuget-packages-config:
    description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
    required: false
    default: Assets/packages.config

outputs:
  unity-path:
    description: "Unity.app 内の実行ファイルパス。後続の Unity 呼び出しで再利用する。"
    value: ${{ steps.verify.outputs.unity-path }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive
        fetch-depth: 1
        # セルフホストランナーでは Library/ や Assets/Packages/ 等の
        # git 管理外ファイルをビルドキャッシュとして保持するため clean を無効にする。
        clean: false

    - name: Verify Unity installation
      id: verify
      shell: bash
      env:
        UNITY_VERSION: ${{ inputs.unity-version }}
      run: |
        # self-hosted runner では Unity を action が配ってくれないため、実機の導入状態を先に検証する。
        UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
        if [ ! -x "$UNITY_PATH" ]; then
          echo "Unity not found at $UNITY_PATH" >&2
          exit 1
        fi
        "$UNITY_PATH" -version
        echo "unity-path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

    - name: Restore NuGet packages
      if: inputs.nuget-restore-method != ''
      shell: bash
      env:
        UNITY_PATH: ${{ steps.verify.outputs.unity-path }}
      run: |
        # packages.config のハッシュを前回復元時と比較し、変更がなければスキップする。
        # セルフホストランナーでは Assets/Packages/ がディスクに残るため、
        # 依存が変わっていなければ毎回 Unity を起動する必要はない。
        HASH_FILE="$GITHUB_WORKSPACE/.nuget-restore-hash"
        CURRENT_HASH=$(shasum "$GITHUB_WORKSPACE/${{ inputs.nuget-packages-config }}" 2>/dev/null | cut -d' ' -f1 || echo "none")

        if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$CURRENT_HASH" ]; then
          echo "packages.config に変更なし — NuGet 復元をスキップします。"
          exit 0
        fi

        echo "packages.config が変更されたため NuGet 復元を実行します。"

        # 手順:
        #   1. -ignoreCompilerErrors + -executeMethod で DLL を復元する
        #   2. 復元した DLL を反映するため再度 Unity を起動して再コンパイルする
        echo "::group::NuGet restore"
        "$UNITY_PATH" \
          -batchmode \
          -quit \
          -nographics \
          -ignoreCompilerErrors \
          -projectPath "$GITHUB_WORKSPACE" \
          -executeMethod "${{ inputs.nuget-restore-method }}" \
          -logFile -
        echo "::endgroup::"

        echo "::group::Recompile after restore"
        "$UNITY_PATH" \
          -batchmode \
          -quit \
          -nographics \
          -ignoreCompilerErrors \
          -projectPath "$GITHUB_WORKSPACE" \
          -logFile -
        echo "::endgroup::"

        # Unity を -ignoreCompilerErrors 付きで起動しているため、executeMethod が内部で
        # 失敗しても exit 0 が返る。hash を保存する前に packages.config の全パッケージが
        # Assets/Packages/<id>.<version>/ として実在することを確認する。
        echo "::group::Validate restored packages"
        MISSING=""
        CONFIG_PATH="$GITHUB_WORKSPACE/${{ inputs.nuget-packages-config }}"
        while IFS= read -r line; do
          # <package id="..." version="..." /> の行だけを対象にする。
          case "$line" in
            *"<package"*) ;;
            *) continue ;;
          esac
          PKG_ID=$(printf '%s' "$line" | sed -E 's/.*id="([^"]+)".*/\1/')
          PKG_VER=$(printf '%s' "$line" | sed -E 's/.*version="([^"]+)".*/\1/')
          if [ -z "$PKG_ID" ] || [ -z "$PKG_VER" ]; then
            continue
          fi
          if [ ! -d "$GITHUB_WORKSPACE/Assets/Packages/${PKG_ID}.${PKG_VER}" ]; then
            MISSING="${MISSING}  - ${PKG_ID}.${PKG_VER}"$'\n'
          fi
        done < "$CONFIG_PATH"

        if [ -n "$MISSING" ]; then
          echo "::error::NuGet 復元が不完全です。以下のパッケージが Assets/Packages/ に存在しません:"
          printf '%b' "$MISSING"
          # hash を更新せずに失敗扱いにすることで、次回の CI 実行でも再度復元が試みられる。
          exit 1
        fi
        echo "::endgroup::"

        # 復元が実際に成功した場合のみハッシュを保存し、次回以降のスキップを許可する。
        echo "$CURRENT_HASH" > "$HASH_FILE"
