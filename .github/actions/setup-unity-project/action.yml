name: Setup Unity Project (Self-Hosted)
description: |
  セルフホストランナー向け Unity プロジェクトのセットアップ。
  チェックアウト、Unity バージョン検証、NuGet パッケージ復元を行う。
  後続ステップで使う UNITY_PATH を output として提供する。

inputs:
  unity-version:
    description: Unity Editor のバージョン
    required: true
  nuget-restore-method:
    description: |
      非空なら NuGet 復元を行う (具体的なメソッド名は後方互換のため受けるだけで未使用)。
      復元は NuGetForUnity.Cli (dotnet tool) を使って Unity 起動前に行うため、
      従来の Unity -executeMethod 経由は呼び出さない。
    required: false
    default: ""
  nuget-packages-config:
    description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
    required: false
    default: Assets/packages.config
  build-target:
    description: "warm-up Unity 起動に渡す -buildTarget（本ビルドと揃えて二重 import を防ぐ。空なら未指定）"
    required: false
    default: ""
  library-health-check-method:
    description: |
      Library の健全性を検査する静的メソッド (-executeMethod に渡す)。空なら検査しない。
      ArtifactDB があっても中身が壊れている個体が存在し、その状態はログに痕跡を残さずテストでのみ顕在化する。
      検査が失敗したら Library を捨てて cold から作り直し、もう一度だけ検査する。
      メソッドは異常時に非ゼロ終了すること (EditorApplication.Exit(1) 等)。
    required: false
    default: ""

outputs:
  unity-path:
    description: "Unity.app 内の実行ファイルパス。後続の Unity 呼び出しで再利用する。"
    value: ${{ steps.verify.outputs.unity-path }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive
        fetch-depth: 1
        # セルフホストランナーでは Library/ や Assets/Packages/ 等の
        # git 管理外ファイルをビルドキャッシュとして保持するため clean を無効にする。
        clean: false

    - name: Repair LFS files
      shell: bash
      run: |
        # clean:false 再利用ワークスペースでは smudge 失敗ポインタが index clean 扱いとなり pull の checkout も skip する
        git lfs pull

        # 残ポインタは破損/部分キャッシュを pull が「取得済み」と誤認して skip するのが原因: 該当 OID のキャッシュ実体を消して再取得を強制する
        STUCK_OIDS=$(git lfs ls-files -l | awk '$2 == "-" {print $1}')
        if [ -n "$STUCK_OIDS" ]; then
          echo "::group::残ポインタを強制実体化"
          printf '%s\n' "$STUCK_OIDS" | while IFS= read -r oid; do
            [ -n "$oid" ] && rm -f ".git/lfs/objects/${oid:0:2}/${oid:2:2}/${oid}"
          done
          git lfs ls-files | awk '{s=$2; $1=""; $2=""; sub(/^ +/, ""); if (s == "-") print}' | while IFS= read -r f; do
            [ -n "$f" ] && rm -f "$f"
          done
          git lfs pull
          echo "::endgroup::"
        fi

        REMAINING=$(git lfs ls-files | awk '$2 == "-"' | wc -l | tr -d ' ')
        if [ "$REMAINING" -gt 0 ]; then
          echo "::error::ポインタのまま実体化されていない LFS ファイルが ${REMAINING} 件あります:"
          git lfs ls-files | awk '$2 == "-"'
          exit 1
        fi

    - name: Remove stale Unity lockfile
      shell: bash
      run: |
        # 前回のCIが異常終了した場合にロックファイルが残り、次のUnity起動がブロックされるのを防ぐ。
        rm -f "$GITHUB_WORKSPACE/Temp/UnityLockfile"

    - name: Setup .NET SDK
      # NuGetForUnity.Cli は dotnet グローバルツール。self-hosted runner には
      # .NET SDK が常駐していないため、ここで明示的に入れる。
      # format-check ワークフローが書き出した global.json (rollForward=disable, 8.0.123)
      # がワークスペースに残り得るため、それに揃えて 8.0.123 を install する。
      if: inputs.nuget-restore-method != ''
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.123

    - name: Verify Unity installation
      id: verify
      shell: bash
      env:
        UNITY_VERSION: ${{ inputs.unity-version }}
      run: |
        # self-hosted runner では Unity を action が配ってくれないため、実機の導入状態を先に検証する。
        UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
        if [ ! -x "$UNITY_PATH" ]; then
          echo "Unity not found at $UNITY_PATH" >&2
          exit 1
        fi
        "$UNITY_PATH" -version
        echo "unity-path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

    - name: Restore NuGet packages
      if: inputs.nuget-restore-method != ''
      shell: bash
      env:
        UNITY_PATH: ${{ steps.verify.outputs.unity-path }}
        BUILD_TARGET: ${{ inputs.build-target }}
      run: |
        # packages.config の hash と、Assets/Packages/ 配下の実体パッケージの両方を見て
        # 復元が必要か判定する。hash だけで判定すると、過去に復元失敗状態のまま hash が
        # 保存されたランナーで以降ずっと復元がスキップされ続ける問題が起きる。
        HASH_FILE="$GITHUB_WORKSPACE/.nuget-restore-hash"
        CONFIG_PATH="$GITHUB_WORKSPACE/${{ inputs.nuget-packages-config }}"
        PACKAGES_DIR="$GITHUB_WORKSPACE/Assets/Packages"

        # nix 管理の self-hosted runner は PATH に /usr/bin が無く shasum が見つからないため、候補を順に試す
        compute_hash() {
          if command -v shasum >/dev/null 2>&1; then shasum "$1" | cut -d' ' -f1
          elif command -v sha1sum >/dev/null 2>&1; then sha1sum "$1" | cut -d' ' -f1
          elif command -v openssl >/dev/null 2>&1; then openssl dgst -sha1 "$1" | awk '{print $NF}'
          else echo "none"
          fi
        }
        CURRENT_HASH=$(compute_hash "$CONFIG_PATH" 2>/dev/null || echo "none")

        # packages.config に書かれた全パッケージが Assets/Packages/<id>.<version>/ に
        # 実在するかを検証する関数。欠損があれば MISSING に改行区切りで詰める。
        validate_packages() {
          MISSING=""
          while IFS= read -r line; do
            # <package id="..." version="..." /> の行だけを対象にする。
            # ルートタグ <packages> と区別するため `<package id=` を厳密にマッチさせる。
            case "$line" in
              *"<package id="*) ;;
              *) continue ;;
            esac
            # sed -n ... p で、パターン不一致時は何も出力しない（= 空文字）。
            PKG_ID=$(printf '%s' "$line" | sed -nE 's/.*id="([^"]+)".*/\1/p')
            PKG_VER=$(printf '%s' "$line" | sed -nE 's/.*version="([^"]+)".*/\1/p')
            if [ -z "$PKG_ID" ] || [ -z "$PKG_VER" ]; then
              continue
            fi
            if [ ! -d "$PACKAGES_DIR/${PKG_ID}.${PKG_VER}" ]; then
              MISSING="${MISSING}  - ${PKG_ID}.${PKG_VER}"$'\n'
            fi
          done < "$CONFIG_PATH"
        }

        # --- アナライザ DLL の .meta を Unity 起動前に正解形式へ揃える ---
        # Unity 6 は analyzers/ 配下の DLL に「Any / Editor 両方無効 + RoslynAnalyzer ラベル」が揃っていないと
        # 通常プラグインとして参照検証し、Microsoft.CodeAnalysis 未解決 → それを暗黙参照する全アセンブリが
        # "Reference has errors" で読み込まれなくなる (テストは全 fixture が "No arguments were provided" で全滅)。
        # NuGetForUnity.Cli が書く .meta は Any しか無効化せず、Unity が生成する既定 .meta はラベル自体が無い。
        # どちらも Unity 側の NugetAssetPostprocessor が書き直すまで壊れたままで、-quit のウォームアップでは
        # その書き直しが走らない。ジョブ中断で import が途切れたランナーは以降のジョブが毎回この状態で落ちる。
        find_analyzer_metas() {
          find "$PACKAGES_DIR" -path '*/analyzers/*' -name '*.dll.meta' 2>/dev/null
        }

        # .meta が無い / labels キーが無い (Unity 既定生成) / guid を読めない DLL は CLI に .meta を再生成させる。
        # RoslynAnalyzer にすべき Roslyn 版の判定は CLI 側が持つため、ここでは削除して復元を強制するだけにする
        BROKEN=0
        while IFS= read -r dll; do
          [ -n "$dll" ] || continue
          meta="${dll}.meta"
          if [ ! -f "$meta" ] || ! grep -q '^labels' "$meta" || ! grep -qE '^guid: [0-9a-fA-F]{32}[[:space:]]*$' "$meta"; then
            rm -f "$meta"
            BROKEN=$((BROKEN + 1))
          fi
        done < <(find "$PACKAGES_DIR" -path '*/analyzers/*' -name '*.dll' 2>/dev/null)

        # NuGetForUnity ラベル (Unity 側で処理済みの印) が無い .meta を、NugetAssetPostprocessor と同じ結果の形式に書き換える
        normalize_analyzer_metas() {
          local fixed=0 meta guid labels
          while IFS= read -r meta; do
            [ -n "$meta" ] || continue
            grep -q '^- NuGetForUnity$' "$meta" && continue
            guid=$(sed -nE 's/^guid: ([0-9a-fA-F]{32})[[:space:]]*$/\1/p' "$meta" | head -1)
            if [ -z "$guid" ]; then
              # 上の検査で除去済みのはずなので、ここに来たら復元が .meta を作れていない
              echo "::error::guid を読めないアナライザ .meta が残っています: $meta"
              exit 1
            fi
            labels=$'labels:\n- NuGetForUnity'
            if grep -q '^- RoslynAnalyzer$' "$meta"; then
              labels="$labels"$'\n- RoslynAnalyzer'
            fi
            cat > "${meta}.tmp" <<META
        fileFormatVersion: 2
        guid: ${guid}
        ${labels}
        PluginImporter:
          externalObjects: {}
          serializedVersion: 3
          iconMap: {}
          executionOrder: {}
          defineConstraints: []
          isPreloaded: 0
          isOverridable: 0
          isExplicitlyReferenced: 0
          validateReferences: 1
          platformData:
            Any:
              enabled: 0
              settings:
                'Exclude ': 0
                Exclude Android: 0
                Exclude CloudRendering: 0
                Exclude EmbeddedLinux: 0
                Exclude GameCoreScarlett: 0
                Exclude GameCoreXboxOne: 0
                Exclude Kepler: 0
                Exclude Linux64: 0
                Exclude OSXUniversal: 0
                Exclude PS4: 0
                Exclude PS5: 0
                Exclude QNX: 0
                Exclude Switch: 0
                Exclude Switch2: 0
                Exclude VisionOS: 0
                Exclude WebGL: 0
                Exclude Win: 0
                Exclude Win64: 0
                Exclude WindowsStoreApps: 0
                Exclude XboxOne: 0
                Exclude iOS: 0
                Exclude tvOS: 0
            Editor:
              enabled: 0
              settings:
                DefaultValueInitialized: true
            WindowsStoreApps:
              enabled: 0
              settings:
                CPU: AnyCPU
          userData: 
          assetBundleName: 
          assetBundleVariant: 
        META
            mv -f "${meta}.tmp" "$meta"
            fixed=$((fixed + 1))
          done < <(find_analyzer_metas)
          echo "アナライザ .meta を ${fixed} 件正規化しました。"
        }

        DO_RESTORE=1
        if [ "$BROKEN" -gt 0 ]; then
          echo "::warning::欠落・ラベル無し・guid 不明のアナライザ .meta が ${BROKEN} 件あったため削除しました。NuGet 復元で再生成します。"
        elif [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$CURRENT_HASH" ]; then
          # hash 一致時も、Assets/Packages/ の整合性は一度確認する。
          validate_packages
          if [ -z "$MISSING" ]; then
            echo "packages.config と Assets/Packages/ の内容が一致 — NuGet 復元をスキップします。"
            DO_RESTORE=0
          else
            echo "::warning::hash は一致しているが Assets/Packages/ が不完全。強制的に NuGet 復元を実行します。"
            printf '%b' "$MISSING"
          fi
        else
          echo "packages.config が変更されたため NuGet 復元を実行します。"
        fi

        if [ "$DO_RESTORE" -eq 0 ]; then
          # 復元は不要でも、前回ジョブの中断等で崩れた .meta はここで直しておく
          normalize_analyzer_metas
          exit 0
        fi

        # NuGetForUnity.Cli を使って Unity を介さず NuGet パッケージを復元する。
        #
        # 従来は Unity -executeMethod NuGetRestore.Restore に依存していたが、
        # cold-cache の self-hosted runner で chicken-and-egg を引き起こしていた:
        #   - LitMotion / ZLogger.Unity 等が R3 拡張で precompiled R3.dll に依存
        #   - R3.dll は NuGet パッケージなので復元前は missing
        #   - 上流 asmdef の compile が失敗
        #   - Bee の dependency tracking が下流 asmdef (= NuGetRestore クラスを含む
        #     Editor アセンブリ) の compile を skip
        #   - Unity が executeMethod のクラスを load できず "class not found" で abort
        #   - 復元が走らないまま終了 → 次回 CI も同じ状態でループ
        # CLI 経由なら Unity の compile graph に一切依存せず Assets/Packages/ を埋められる。
        # ただし CLI が書くアナライザ .meta は Unity 6 では不十分なので、直後に normalize_analyzer_metas で揃える。
        echo "::group::NuGet restore (NuGetForUnity.Cli)"
        # dotnet グローバルツールの PATH を有効化。
        # 初回の install 時のみ PATH を export する必要があるため、明示的に追加。
        export PATH="$HOME/.dotnet/tools:$PATH"
        if ! command -v nugetforunity >/dev/null 2>&1; then
          echo "dotnet tool install --global NuGetForUnity.Cli"
          dotnet tool install --global NuGetForUnity.Cli
        else
          # 既存ツールが古いと最新の packages.config 仕様に追従できない場合があるため update も試みる。
          dotnet tool update --global NuGetForUnity.Cli 2>/dev/null || true
        fi
        nugetforunity restore "$GITHUB_WORKSPACE"
        normalize_analyzer_metas
        echo "::endgroup::"

        # Unity を一度起動して、CLI で並べた DLL の .meta を AssetDatabase に取り込む。
        # これをやらずに後続の WebGL build step に直接行くと、Unity 初回起動時に
        #   - .dll の import
        #   - 全 asmdef の compile
        # が並行で走り、source generator DLL の RoslynAnalyzer label 解決が
        # csc invocation に間に合わないケースがある (Effects.dll の `MapTo` が
        # ソースジェネレートされず "MapTo does not exist" になる)。
        # warm-up 用にここで一度起動して、import と初回 compile を済ませる。
        echo "::group::Warm-up Unity (asset import + first compile)"
        WARMUP_LOG="${RUNNER_TEMP:-/tmp}/unity-warmup-restore.log"
        WARMUP_ARGS=(-batchmode -quit -nographics -projectPath "$GITHUB_WORKSPACE" -logFile -)
        if [ -n "$BUILD_TARGET" ]; then
          # 本ビルドと buildTarget を揃え、プラットフォーム切り替えによる二重 import を防ぐ。
          WARMUP_ARGS+=(-buildTarget "$BUILD_TARGET")
        fi
        set +e
        "$UNITY_PATH" "${WARMUP_ARGS[@]}" 2>&1 | tee "$WARMUP_LOG"
        WARMUP_STATUS=${PIPESTATUS[0]}
        set -e
        if [ "$WARMUP_STATUS" -ne 0 ]; then
          echo "::warning::Warm-up Unity が非ゼロ終了したが、続行する (validate_packages で必要な復元結果を再確認)"
        fi
        echo "::endgroup::"
        bash "${{ github.action_path }}/assert-assemblies-loaded.sh" "$WARMUP_LOG"

        echo "::group::Validate restored packages"
        validate_packages
        if [ -n "$MISSING" ]; then
          echo "::error::NuGet 復元が不完全です。以下のパッケージが Assets/Packages/ に存在しません:"
          printf '%b' "$MISSING"
          # hash を更新せずに失敗扱いにすることで、次回の CI 実行でも再度復元が試みられる。
          exit 1
        fi
        echo "::endgroup::"

        # 復元が実際に成功した場合のみハッシュを保存し、次回以降のスキップを許可する。
        echo "$CURRENT_HASH" > "$HASH_FILE"

    - name: Warm-up Unity on cold Library
      shell: bash
      env:
        UNITY_PATH: ${{ steps.verify.outputs.unity-path }}
        BUILD_TARGET: ${{ inputs.build-target }}
      run: |
        # Library 消失時も .nuget-restore-hash が残ると復元側 warm-up がスキップされ、cold ビルドが source generator のラベル解決レースを踏むため。
        if [ -f "$GITHUB_WORKSPACE/Library/ArtifactDB" ]; then
          echo "Library は warm — warm-up をスキップします。"
          exit 0
        fi
        echo "::group::Warm-up Unity (cold Library)"
        WARMUP_LOG="${RUNNER_TEMP:-/tmp}/unity-warmup-cold.log"
        WARMUP_ARGS=(-batchmode -quit -nographics -projectPath "$GITHUB_WORKSPACE" -logFile -)
        if [ -n "$BUILD_TARGET" ]; then
          WARMUP_ARGS+=(-buildTarget "$BUILD_TARGET")
        fi
        set +e
        "$UNITY_PATH" "${WARMUP_ARGS[@]}" 2>&1 | tee "$WARMUP_LOG"
        WARMUP_STATUS=${PIPESTATUS[0]}
        set -e
        if [ "$WARMUP_STATUS" -ne 0 ]; then
          echo "::warning::Warm-up Unity が非ゼロ終了したが、続行する"
        fi
        echo "::endgroup::"

    - name: Verify Library health
      if: inputs.library-health-check-method != ''
      shell: bash
      env:
        UNITY_PATH: ${{ steps.verify.outputs.unity-path }}
        BUILD_TARGET: ${{ inputs.build-target }}
        CHECK_METHOD: ${{ inputs.library-health-check-method }}
      run: |
        # warm と判定した Library でも中身が壊れていることがある (アセットを解決できないのに
        # ArtifactDB は存在する)。ログには出ずテストで初めて落ちるので、ここで実際に叩いて確かめる。
        run_check() {
          local log="$1"
          local args=(-batchmode -quit -nographics -projectPath "$GITHUB_WORKSPACE" -logFile - -executeMethod "$CHECK_METHOD")
          if [ -n "$BUILD_TARGET" ]; then
            args+=(-buildTarget "$BUILD_TARGET")
          fi
          set +e
          "$UNITY_PATH" "${args[@]}" 2>&1 | tee "$log"
          local status=${PIPESTATUS[0]}
          set -e
          return "$status"
        }

        echo "::group::Verify Library health ($CHECK_METHOD)"
        if run_check "${RUNNER_TEMP:-/tmp}/unity-health-1.log"; then
          echo "Library は健全です。"
          echo "::endgroup::"
          exit 0
        fi

        echo "::warning::Library の健全性検査に失敗しました。Library を破棄して作り直します。"
        rm -rf "$GITHUB_WORKSPACE/Library"

        if run_check "${RUNNER_TEMP:-/tmp}/unity-health-2.log"; then
          echo "再構築後の Library は健全です。"
          echo "::endgroup::"
          exit 0
        fi

        echo "::endgroup::"
        echo "::error::Library を作り直しても健全性検査に失敗しました。キャッシュ破損ではなくプロジェクト側の問題の可能性があります。"
        exit 1
        bash "${{ github.action_path }}/assert-assemblies-loaded.sh" "$WARMUP_LOG"
