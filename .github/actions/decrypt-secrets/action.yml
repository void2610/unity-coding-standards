name: Decrypt CI Secrets
description: |
  unity-coding-standards/secrets/ci.yaml を sops で復号し、
  各キーを GITHUB_ENV に環境変数として出力する。
  呼び出し側リポジトリには SOPS_AGE_KEY secret のみ必要。

inputs:
  sops-age-key:
    description: "sops 復号用の AGE 秘密鍵"
    required: true

outputs:
  cloudflare-account-id:
    description: "Cloudflare Account ID"
    value: ${{ steps.decrypt.outputs.cloudflare_account_id }}
  cloudflare-api-token:
    description: "Cloudflare API Token"
    value: ${{ steps.decrypt.outputs.cloudflare_api_token }}
  netlify-auth-token:
    description: "Netlify Personal Access Token"
    value: ${{ steps.decrypt.outputs.netlify_auth_token }}

runs:
  using: composite
  steps:
    - name: Decrypt secrets
      id: decrypt
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        # unity-coding-standards サブモジュール内の暗号化ファイルを復号する。
        SECRETS_FILE="$GITHUB_WORKSPACE/unity-coding-standards/secrets/ci.yaml"
        if [ ! -f "$SECRETS_FILE" ]; then
          echo "::error::Secrets file not found: $SECRETS_FILE"
          exit 1
        fi

        # キー未定義でも呼び出し側 workflow が使わなければ問題ないよう、失敗時は空文字列を返す。
        extract() {
          sops -d --extract "[\"$1\"]" "$SECRETS_FILE" 2>/dev/null || true
        }

        ACCOUNT_ID=$(extract cloudflare_account_id)
        API_TOKEN=$(extract cloudflare_api_token)
        NETLIFY_TOKEN=$(extract netlify_auth_token)

        # 値が入っていればマスクして GitHub ログに表示されないようにする。
        [ -n "$ACCOUNT_ID" ] && echo "::add-mask::$ACCOUNT_ID"
        [ -n "$API_TOKEN" ] && echo "::add-mask::$API_TOKEN"
        [ -n "$NETLIFY_TOKEN" ] && echo "::add-mask::$NETLIFY_TOKEN"

        echo "cloudflare_account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
        echo "cloudflare_api_token=$API_TOKEN" >> "$GITHUB_OUTPUT"
        echo "netlify_auth_token=$NETLIFY_TOKEN" >> "$GITHUB_OUTPUT"
