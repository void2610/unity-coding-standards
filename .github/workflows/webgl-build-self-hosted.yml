name: Shared WebGL Build (Self-Hosted)

on:
  workflow_call:
    inputs:
      unity-version:
        description: "Unity Editor のバージョン（例: 6000.3.10f1）"
        required: true
        type: string
      execute-method:
        description: "-executeMethod に渡すビルドメソッドの完全修飾名"
        required: true
        type: string
      runner-labels:
        description: "self-hosted runner のラベル配列（JSON 形式、例: [\"self-hosted\",\"macos\"]）"
        required: true
        type: string
      build-output-path:
        description: "ビルド成果物の出力先パス"
        required: false
        type: string
        default: CIBuilds/WebGL/build
      cloudflare-project-name:
        description: "Cloudflare Pages のプロジェクト名"
        required: true
        type: string
      deploy-branch:
        description: "Cloudflare Pages のデプロイブランチ（main で本番、それ以外でプレビュー）"
        required: false
        type: string
        default: main
      nuget-restore-method:
        description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列でスキップ）"
        required: false
        type: string
        default: ""
      nuget-packages-config:
        description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
        required: false
        type: string
        default: Assets/packages.config
      pr-number:
        description: "PR 番号（PR プレビュー通知を送る場合に指定）"
        required: false
        type: string
        default: ""
      pr-title:
        description: "PR タイトル（PR プレビュー通知用）"
        required: false
        type: string
        default: ""
      pr-url:
        description: "PR の URL（PR プレビュー通知用）"
        required: false
        type: string
        default: ""
      pr-head-sha:
        description: "PR のヘッドコミット SHA（pull_request イベントでは github.sha がマージコミットになるため）"
        required: false
        type: string
        default: ""
      notify-discord:
        description: "Discord 通知を送るかどうか。false にするとビルド・デプロイのみ行う（PR の 2 回目以降の push で重複通知を避ける用途）"
        required: false
        type: boolean
        default: true
    secrets:
      SOPS_AGE_KEY:
        required: true
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  build:
    name: Build WebGL
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      UNITY_BUILD_OUTPUT_PATH: ${{ inputs.build-output-path }}
    steps:
      - name: Setup Unity project
        id: setup
        uses: void2610/unity-coding-standards/.github/actions/setup-unity-project@main
        with:
          unity-version: ${{ inputs.unity-version }}
          nuget-restore-method: ${{ inputs.nuget-restore-method }}
          nuget-packages-config: ${{ inputs.nuget-packages-config }}

      - name: Build WebGL
        timeout-minutes: 45
        uses: void2610/unity-coding-standards/.github/actions/unity-webgl-build@main
        with:
          unity-path: ${{ steps.setup.outputs.unity-path }}
          execute-method: ${{ inputs.execute-method }}
          build-output-path: ${{ inputs.build-output-path }}

      - name: Decrypt secrets
        id: secrets
        uses: void2610/unity-coding-standards/.github/actions/decrypt-secrets@main
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.secrets.outputs.cloudflare-account-id }}
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.cloudflare-api-token }}
        run: |
          npx wrangler pages deploy "${UNITY_BUILD_OUTPUT_PATH}" \
            --project-name="${{ inputs.cloudflare-project-name }}" \
            --branch="${{ inputs.deploy-branch }}"

      - name: Compute deploy URL
        id: deploy-url
        env:
          CLOUDFLARE_PROJECT: ${{ inputs.cloudflare-project-name }}
          DEPLOY_BRANCH: ${{ inputs.deploy-branch }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            # Cloudflare Pages の プレビュー URL 用にブランチ名をサニタイズする
            SANITIZED_BRANCH=$(echo "$DEPLOY_BRANCH" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9]/-/g' \
              | sed 's/--*/-/g' \
              | sed 's/^-\|-$//g')
            URL="https://${SANITIZED_BRANCH}.${CLOUDFLARE_PROJECT}.pages.dev/"
          else
            URL="https://${CLOUDFLARE_PROJECT}.pages.dev/"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ inputs.notify-discord }}
        uses: void2610/unity-coding-standards/.github/actions/notify-discord@main
        with:
          discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          deploy-url: ${{ steps.deploy-url.outputs.url }}
          commit-sha: ${{ inputs.pr-head-sha || github.sha }}
          pr-number: ${{ inputs.pr-number }}
          pr-title: ${{ inputs.pr-title }}
          pr-url: ${{ inputs.pr-url }}
