name: Shared WebGL Build Netlify (Self-Hosted)

on:
  workflow_call:
    inputs:
      unity-version:
        description: "Unity Editor のバージョン（例: 6000.3.10f1）"
        required: true
        type: string
      execute-method:
        description: "-executeMethod に渡すビルドメソッドの完全修飾名"
        required: true
        type: string
      runner-labels:
        description: "self-hosted runner のラベル配列（JSON 形式、例: [\"self-hosted\",\"macOS\"]）"
        required: true
        type: string
      build-output-path:
        description: "ビルド成果物の出力先パス"
        required: false
        type: string
        default: CIBuilds/WebGL/build
      nuget-restore-method:
        description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列でスキップ）"
        required: false
        type: string
        default: ""
      nuget-packages-config:
        description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
        required: false
        type: string
        default: Assets/packages.config
      deploy-alias:
        description: "Netlify のデプロイエイリアス（空文字列だと本番デプロイ）"
        required: false
        type: string
        default: ""
      deploy-message:
        description: "Netlify のデプロイメッセージ"
        required: false
        type: string
        default: ""
      pr-number:
        description: "PR 番号（PR プレビュー通知を送る場合に指定）"
        required: false
        type: string
        default: ""
      pr-title:
        description: "PR タイトル（PR プレビュー通知用）"
        required: false
        type: string
        default: ""
      pr-url:
        description: "PR の URL（PR プレビュー通知用）"
        required: false
        type: string
        default: ""
      pr-head-sha:
        description: "PR のヘッドコミット SHA（pull_request イベントでは github.sha がマージコミットになるため）"
        required: false
        type: string
        default: ""
    secrets:
      SOPS_AGE_KEY:
        required: true
      NETLIFY_SITE_ID:
        required: true
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  build:
    name: Build WebGL
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      UNITY_BUILD_OUTPUT_PATH: ${{ inputs.build-output-path }}
    steps:
      - name: Setup Unity project
        id: setup
        uses: void2610/unity-coding-standards/.github/actions/setup-unity-project@main
        with:
          unity-version: ${{ inputs.unity-version }}
          nuget-restore-method: ${{ inputs.nuget-restore-method }}
          nuget-packages-config: ${{ inputs.nuget-packages-config }}

      - name: Build WebGL
        timeout-minutes: 45
        uses: void2610/unity-coding-standards/.github/actions/unity-webgl-build@main
        with:
          unity-path: ${{ steps.setup.outputs.unity-path }}
          execute-method: ${{ inputs.execute-method }}
          build-output-path: ${{ inputs.build-output-path }}

      - name: Generate Netlify _headers
        env:
          UNITY_BUILD_OUTPUT_PATH: ${{ inputs.build-output-path }}
        run: |
          # Brotli/Gzip 圧縮済み WebGL 成果物をブラウザにネイティブ解凍させるため、
          # Content-Encoding と Content-Type を明示する。未設定だと loader.js が
          # JS で解凍し、起動が目に見えて遅くなる。
          cat > "${UNITY_BUILD_OUTPUT_PATH}/_headers" <<'HEADERS'
          /Build/*.data.unityweb
            Content-Encoding: br
            Content-Type: application/octet-stream
          /Build/*.wasm.unityweb
            Content-Encoding: br
            Content-Type: application/wasm
          /Build/*.framework.js.unityweb
            Content-Encoding: br
            Content-Type: application/javascript
          /Build/*.data.br
            Content-Encoding: br
            Content-Type: application/octet-stream
          /Build/*.wasm.br
            Content-Encoding: br
            Content-Type: application/wasm
          /Build/*.framework.js.br
            Content-Encoding: br
            Content-Type: application/javascript
          /Build/*.data.gz
            Content-Encoding: gzip
            Content-Type: application/octet-stream
          /Build/*.wasm.gz
            Content-Encoding: gzip
            Content-Type: application/wasm
          /Build/*.framework.js.gz
            Content-Encoding: gzip
            Content-Type: application/javascript
          HEADERS

      - name: Decrypt secrets
        id: secrets
        uses: void2610/unity-coding-standards/.github/actions/decrypt-secrets@main
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy to Netlify
        id: deploy
        timeout-minutes: 15
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.secrets.outputs.netlify-auth-token }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_ALIAS: ${{ inputs.deploy-alias }}
          DEPLOY_MESSAGE: ${{ inputs.deploy-message }}
        run: |
          # alias が空なら本番デプロイ、指定があればプレビューデプロイ。
          if [ -n "$DEPLOY_ALIAS" ]; then
            DEPLOY_ARGS=(--alias "$DEPLOY_ALIAS")
          else
            DEPLOY_ARGS=(--prod)
          fi

          if [ -n "$DEPLOY_MESSAGE" ]; then
            DEPLOY_ARGS+=(--message "$DEPLOY_MESSAGE")
          fi

          DEPLOY_JSON=$(npx --yes netlify-cli@latest deploy \
            --dir "${UNITY_BUILD_OUTPUT_PATH}" \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --json \
            "${DEPLOY_ARGS[@]}")

          echo "$DEPLOY_JSON"

          DEPLOY_URL=$(echo "$DEPLOY_JSON" | jq -r '.deploy_url')
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        uses: void2610/unity-coding-standards/.github/actions/notify-discord@main
        with:
          discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          deploy-url: ${{ steps.deploy.outputs.deploy_url }}
          commit-sha: ${{ inputs.pr-head-sha || github.sha }}
          pr-number: ${{ inputs.pr-number }}
          pr-title: ${{ inputs.pr-title }}
          pr-url: ${{ inputs.pr-url }}
