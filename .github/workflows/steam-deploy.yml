name: Shared Steam Deploy

on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string
      build-name:
        required: true
        type: string
      release-branch:
        required: false
        type: string
        default: test
      windows-artifact-name:
        required: false
        type: string
        default: windows-build
      mac-artifact-name:
        required: false
        type: string
        default: mac-build
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      STEAM_USERNAME:
        required: true
      STEAM_CONFIG_VDF:
        required: true
      STEAM_APP_ID:
        required: true

jobs:
  check-changes:
    name: Check if build needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if build already deployed
        id: check
        run: |
          current_sha="${{ github.sha }}"
          cache_key="steam-deploy-${current_sha}"

          if gh cache list --key "${cache_key}" --json key --jq '.[].key' | grep -q "^${cache_key}$"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "This commit (${current_sha:0:7}) is already deployed."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build will run for commit ${current_sha:0:7}."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  generate-version:
    name: Generate Version
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    outputs:
      version: ${{ steps.version.outputs.buildVersion }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version string
        id: version
        run: |
          base_version="$(git tag --sort=-version:refname | head -n 1 || echo "0.0.0")"
          date_jst="$(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M:%S')"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          full_version="${base_version} ${date_jst} ${short_sha}"
          echo "buildVersion=${full_version}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${full_version}"

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: [check-changes, generate-version]
    if: needs.check-changes.outputs.should_build == 'true'
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          docker system prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Fix symlink for my-unity-utils
        run: |
          rm -rf Assets/Scripts/Utils
          cp -r my-unity-utils Assets/Scripts/Utils

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: Build Windows project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: ${{ inputs.unity-version }}
          allowDirtyBuild: true
          buildsPath: builds
          buildName: ${{ inputs.build-name }}
          versioning: Custom
          version: ${{ needs.generate-version.outputs.version }}

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.windows-artifact-name }}
          path: builds/StandaloneWindows64
          retention-days: 1

  build-mac:
    name: Build Mac
    runs-on: macos-latest
    needs: [check-changes, generate-version]
    if: needs.check-changes.outputs.should_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Fix symlink for my-unity-utils
        run: |
          rm -rf Assets/Scripts/Utils
          cp -r my-unity-utils Assets/Scripts/Utils

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Mac-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Mac-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: Build Mac project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          unityVersion: ${{ inputs.unity-version }}
          allowDirtyBuild: true
          buildsPath: builds
          buildName: ${{ inputs.build-name }}
          versioning: Custom
          version: ${{ needs.generate-version.outputs.version }}

      - name: Upload Mac build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mac-artifact-name }}
          path: builds/StandaloneOSX
          retention-days: 1

  deploy-steam:
    name: Deploy to Steam
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    environment:
      name: steam-production
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.windows-artifact-name }}
          path: builds/StandaloneWindows64

      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.mac-artifact-name }}
          path: builds/StandaloneOSX

      - name: Get short SHA
        id: short_sha
        run: echo "sha_short=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Steam
        id: steam_deploy
        continue-on-error: true
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: auto deploy via github actions (${{ steps.short_sha.outputs.sha_short }})
          rootPath: builds
          depot1Path: StandaloneWindows64
          depot2Path: StandaloneOSX
          releaseBranch: ${{ inputs.release-branch }}

      - name: Create deploy marker file
        if: steps.steam_deploy.outcome == 'success'
        run: |
          mkdir -p .deploy-cache
          echo "deployed at $(date)" > .deploy-cache/marker

      - name: Mark as deployed
        if: steps.steam_deploy.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .deploy-cache
          key: steam-deploy-${{ github.sha }}
