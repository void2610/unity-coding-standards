name: Shared Unity Test (Self-Hosted)

on:
  workflow_call:
    inputs:
      job-name:
        required: false
        type: string
        default: EditMode テスト
      test-mode:
        description: テストプラットフォーム（EditMode / PlayMode）
        required: false
        type: string
        default: EditMode
      unity-version:
        required: true
        type: string
      runner-labels:
        description: "self-hosted runner のラベル配列（JSON 形式、例: [\"self-hosted\",\"macos\"]）"
        required: true
        type: string
      artifact-name:
        required: false
        type: string
        default: test-results
      extra-artifact-path:
        description: "テスト後に追加回収するパス (例: 失敗診断の出力)。空でスキップ"
        required: false
        type: string
        default: ""
      pr-number:
        required: false
        type: number
        default: 0
      nuget-restore-method:
        description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列で復元ステップをスキップ）"
        required: false
        type: string
        default: ""
      nuget-packages-config:
        description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
        required: false
        type: string
        default: Assets/packages.config
      nographics:
        description: |
          true (既定) で `-nographics` を Unity に渡す。
          false にすると graphics device を初期化する (UI Toolkit / EditorWindow に
          依存するテストはこちらが必要)。GitHub-hosted runner や display 無しの
          self-hosted runner は true のままにする。
        required: false
        type: boolean
        default: true
      fail-on-test-failures:
        description: |
          true (既定) で Unity の `-runTests` が exit code 2 (テスト失敗) を返したら
          ジョブも失敗扱いにする。後方互換のため呼び出し側で false に設定すれば
          従来の warning-only 挙動に戻せる。
        required: false
        type: boolean
        default: true

# 同一 PR / ブランチで新しい push が来たら走行中・キュー待ちの古い run をキャンセルする。
# main / develop への直接 push（pull_request 以外）はキャンセルしない。
#
# group に test-mode を含めることで、同一呼び出し側 workflow から EditMode / PlayMode を
# 並べて呼んだときに互いに cancel し合うのを防ぐ (例: jobs.test-editmode と jobs.test-playmode
# が両方この reusable を呼ぶ構成)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.test-mode }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ inputs.job-name }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      TEST_RESULTS_PATH: TestResults/results.xml
    steps:
      - name: Setup Unity project
        id: setup
        uses: void2610/unity-coding-standards/.github/actions/setup-unity-project@main
        with:
          unity-version: ${{ inputs.unity-version }}
          nuget-restore-method: ${{ inputs.nuget-restore-method }}
          nuget-packages-config: ${{ inputs.nuget-packages-config }}

      # self-hosted は workspace が残るため、前回 run の診断が今回の artifact に混ざらないよう先に消す
      - name: Clean extra diagnostics path
        if: ${{ inputs.extra-artifact-path != '' }}
        run: rm -rf "${{ inputs.extra-artifact-path }}"

      - name: Run Unity tests
        env:
          UNITY_PATH: ${{ steps.setup.outputs.unity-path }}
          NOGRAPHICS: ${{ inputs.nographics }}
        run: |
          # パッケージ解決済みの状態でテストを実行する。
          # -runTests は終了コード 0=成功, 2=テスト失敗, それ以外=エラー として返す。
          mkdir -p "$(dirname "$TEST_RESULTS_PATH")"
          EXIT_CODE=0

          # `-nographics` の有無は input でスイッチ。UI Toolkit / EditorWindow に
          # 依存するテスト (Build / Show 等) は graphics device 初期化が必要。
          # display を持つ self-hosted runner では false にできる。
          NOGRAPHICS_FLAG=""
          if [ "$NOGRAPHICS" = "true" ]; then
            NOGRAPHICS_FLAG="-nographics"
          fi

          "$UNITY_PATH" \
            -batchmode \
            $NOGRAPHICS_FLAG \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform "${{ inputs.test-mode }}" \
            -testResults "$GITHUB_WORKSPACE/$TEST_RESULTS_PATH" \
            -logFile - || EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "All tests passed."
          elif [ "$EXIT_CODE" -eq 2 ]; then
            # Unity の `-runTests` は 1 件以上のテスト失敗で 2 を返す。
            # fail-on-test-failures=true (既定) で job も失敗にして CI ログから即座に検知できるようにする。
            # false にすると従来の warning-only 挙動に戻せる (移行期間用)。
            if [ "${{ inputs.fail-on-test-failures }}" = "true" ]; then
              echo "::error::Some tests failed (exit code 2)."
              exit 2
            else
              echo "::warning::Some tests failed (exit code 2)."
            fi
          else
            echo "::error::Unity exited with unexpected code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: Upload extra diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.extra-artifact-path != '' }}
        with:
          name: ${{ inputs.artifact-name }}-diagnostics
          path: ${{ inputs.extra-artifact-path }}
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.TEST_RESULTS_PATH }}

      - name: Comment test results on PR
        if: ${{ always() && inputs.pr-number > 0 }}
        # 結果コメント投稿は非必須のレポート。GitHub API の一時的失敗 (401 等) で
        # テスト本体の成否と無関係にジョブを赤くしないよう、ステップ単位で失敗を許容する。
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TEST_RESULTS_PATH: ${{ env.TEST_RESULTS_PATH }}
          TEST_MODE: ${{ inputs.test-mode }}
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsPath = process.env.TEST_RESULTS_PATH;
            const testMode = process.env.TEST_MODE || 'EditMode';
            const issue_number = Number(process.env.PR_NUMBER);

            // EditMode / PlayMode で別コメントを保持する。以前は marker が hardcode で
            // 'unity-editmode-test-results' 固定だったため後発の job が先発の comment を
            // 上書きしてしまい、PR 上には片方の結果しか残らなかった。
            const marker = `<!-- unity-${testMode.toLowerCase()}-test-results -->`;

            let summary = 'テスト結果ファイルが見つかりませんでした。';
            let detailsSection = '';

            if (fs.existsSync(resultsPath)) {
              const xml = fs.readFileSync(resultsPath, 'utf8');
              const readAttr = (name) => {
                const match = xml.match(new RegExp(`${name}="([^"]+)"`));
                return match ? match[1] : null;
              };

              const total = readAttr('total') ?? readAttr('testcasecount') ?? '0';
              const passed = readAttr('passed') ?? '0';
              const failed = readAttr('failed') ?? '0';
              const skipped = readAttr('skipped') ?? '0';
              const inconclusive = readAttr('inconclusive') ?? '0';
              const duration = readAttr('duration');
              const durationText = duration ? `, duration=${duration}s` : '';

              summary = `${testMode} tests: ${passed}/${total} passed, failed=${failed}, skipped=${skipped}, inconclusive=${inconclusive}${durationText}`;

              const escapeHtml = (value) => value
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');

              const resultIcon = (result) => {
                switch (result) {
                  case 'Passed':
                    return '✅';
                  case 'Failed':
                    return '❌';
                  case 'Skipped':
                    return '⏭️';
                  case 'Inconclusive':
                    return '❔';
                  default:
                    return '•';
                }
              };

              const testCases = Array.from(xml.matchAll(/<test-case\b([^>]*)>/g))
                .map((match) => {
                  const attrs = match[1];
                  const name = attrs.match(/\bname="([^"]+)"/)?.[1];
                  const fullName = attrs.match(/\bfullname="([^"]+)"/)?.[1];
                  const result = attrs.match(/\bresult="([^"]+)"/)?.[1];

                  if (!name || !result) {
                    return null;
                  }

                  const displayName = (fullName ?? name);
                  return `- ${resultIcon(result)} ${escapeHtml(displayName)}`;
                })
                .filter(Boolean);

              if (testCases.length > 0) {
                detailsSection = [
                  '',
                  `<details><summary>All tests (${testCases.length})</summary>`,
                  '',
                  ...testCases,
                  '',
                  '</details>',
                ].join('\n');
              }
            }

            const body = [
              marker,
              `## Unity ${testMode} Test Results`,
              '',
              summary,
              detailsSection,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
