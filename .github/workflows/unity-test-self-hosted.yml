name: Shared Unity Test (Self-Hosted)

on:
  workflow_call:
    inputs:
      job-name:
        required: false
        type: string
        default: EditMode テスト
      test-mode:
        description: テストプラットフォーム（EditMode / PlayMode）
        required: false
        type: string
        default: EditMode
      unity-version:
        required: true
        type: string
      runner-labels:
        description: "self-hosted runner のラベル配列（JSON 形式、例: [\"self-hosted\",\"macos\"]）"
        required: true
        type: string
      artifact-name:
        required: false
        type: string
        default: test-results
      pr-number:
        required: false
        type: number
        default: 0
      nuget-restore-method:
        description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列で復元ステップをスキップ）"
        required: false
        type: string
        default: ""

jobs:
  test:
    name: ${{ inputs.job-name }}
    # 呼び出し側が指定したラベル配列で runner を選択する。
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      TEST_RESULTS_PATH: TestResults/results.xml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Verify Unity installation
        run: |
          # self-hosted runner では Unity を action が配ってくれないため、実機の導入状態を先に検証する。
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          if [ ! -x "$UNITY_PATH" ]; then
            echo "Unity not found at $UNITY_PATH" >&2
            exit 1
          fi
          "$UNITY_PATH" -version

      - name: Restore NuGet packages
        if: inputs.nuget-restore-method != ''
        run: |
          # NuGet for Unity のパッケージ (R3 コア等) は Assets/Packages/ に配置されるが
          # .gitignore で除外されているため、CI 環境では毎回復元が必要。
          # -ignoreCompilerErrors を付けることで、NuGet パッケージ不在による
          # コンパイルエラーがあっても復元処理を最後まで実行させる。
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          "$UNITY_PATH" \
            -batchmode \
            -quit \
            -nographics \
            -ignoreCompilerErrors \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod "${{ inputs.nuget-restore-method }}" \
            -logFile -

      - name: Run Unity tests
        run: |
          # パッケージ解決済みの状態でテストを実行する。
          # -runTests は終了コード 0=成功, 2=テスト失敗, それ以外=エラー として返す。
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          mkdir -p "$(dirname "$TEST_RESULTS_PATH")"
          EXIT_CODE=0
          "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform "${{ inputs.test-mode }}" \
            -testResults "$GITHUB_WORKSPACE/$TEST_RESULTS_PATH" \
            -logFile - || EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "All tests passed."
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "::warning::Some tests failed (exit code 2)."
          else
            echo "::error::Unity exited with unexpected code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.TEST_RESULTS_PATH }}

      - name: Comment test results on PR
        if: ${{ always() && inputs.pr-number > 0 }}
        uses: actions/github-script@v7
        env:
          TEST_RESULTS_PATH: ${{ env.TEST_RESULTS_PATH }}
          TEST_MODE: ${{ inputs.test-mode }}
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- unity-editmode-test-results -->';
            const resultsPath = process.env.TEST_RESULTS_PATH;
            const testMode = process.env.TEST_MODE || 'EditMode';
            const issue_number = Number(process.env.PR_NUMBER);

            let summary = 'テスト結果ファイルが見つかりませんでした。';
            let detailsSection = '';

            if (fs.existsSync(resultsPath)) {
              const xml = fs.readFileSync(resultsPath, 'utf8');
              const readAttr = (name) => {
                const match = xml.match(new RegExp(`${name}="([^"]+)"`));
                return match ? match[1] : null;
              };

              const total = readAttr('total') ?? readAttr('testcasecount') ?? '0';
              const passed = readAttr('passed') ?? '0';
              const failed = readAttr('failed') ?? '0';
              const skipped = readAttr('skipped') ?? '0';
              const inconclusive = readAttr('inconclusive') ?? '0';
              const duration = readAttr('duration');
              const durationText = duration ? `, duration=${duration}s` : '';

              summary = `${testMode} tests: ${passed}/${total} passed, failed=${failed}, skipped=${skipped}, inconclusive=${inconclusive}${durationText}`;

              const escapeHtml = (value) => value
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');

              const resultIcon = (result) => {
                switch (result) {
                  case 'Passed':
                    return '✅';
                  case 'Failed':
                    return '❌';
                  case 'Skipped':
                    return '⏭️';
                  case 'Inconclusive':
                    return '❔';
                  default:
                    return '•';
                }
              };

              const testCases = Array.from(xml.matchAll(/<test-case\b([^>]*)>/g))
                .map((match) => {
                  const attrs = match[1];
                  const name = attrs.match(/\bname="([^"]+)"/)?.[1];
                  const fullName = attrs.match(/\bfullname="([^"]+)"/)?.[1];
                  const result = attrs.match(/\bresult="([^"]+)"/)?.[1];

                  if (!name || !result) {
                    return null;
                  }

                  const displayName = (fullName ?? name);
                  return `- ${resultIcon(result)} ${escapeHtml(displayName)}`;
                })
                .filter(Boolean);

              if (testCases.length > 0) {
                detailsSection = [
                  '',
                  `<details><summary>All tests (${testCases.length})</summary>`,
                  '',
                  ...testCases,
                  '',
                  '</details>',
                ].join('\n');
              }
            }

            const body = [
              marker,
              `## Unity ${testMode} Test Results`,
              '',
              summary,
              detailsSection,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
