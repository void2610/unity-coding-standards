name: Shared WebGL Build GitHub Pages (Self-Hosted)

on:
  workflow_call:
    inputs:
      unity-version:
        description: "Unity Editor のバージョン（例: 6000.3.10f1）"
        required: true
        type: string
      execute-method:
        description: "-executeMethod に渡すビルドメソッドの完全修飾名"
        required: true
        type: string
      runner-labels:
        description: "self-hosted runner のラベル配列（JSON 形式、例: [\"self-hosted\",\"macOS\"]）"
        required: true
        type: string
      build-output-path:
        description: "ビルド成果物の出力先パス"
        required: false
        type: string
        default: CIBuilds/WebGL/build
      deploy-method:
        description: "公開方法。branch は公開ブランチへ push、actions は Pages へ直接デプロイ（呼び出し側に pages: write と id-token: write が要る。100MB を超えるファイルがあるときはこちら）"
        required: false
        type: string
        default: branch
      publish-branch:
        description: "GitHub Pages の公開ブランチ（deploy-method が branch のときだけ使う）"
        required: false
        type: string
        default: gh-pages
      destination-dir:
        description: "公開ブランチ内の配置先ディレクトリ（ルートに置く場合は空文字）"
        required: false
        type: string
        default: ""
      pages-url-base:
        description: "通知に使う GitHub Pages のベースURL（末尾スラッシュなし）"
        required: false
        type: string
        default: ""
      optimize-webgl-build-settings:
        description: "CI向けにWebGLビルド設定を一時的に最適化する"
        required: false
        type: boolean
        default: false
      nuget-restore-method:
        description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列でスキップ）"
        required: false
        type: string
        default: ""
      nuget-packages-config:
        description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
        required: false
        type: string
        default: Assets/packages.config
      pr-number:
        description: "PR 番号（PR プレビュー通知を送る場合に指定）"
        required: false
        type: string
        default: ""
      pr-title:
        description: "PR タイトル（PR プレビュー通知用）"
        required: false
        type: string
        default: ""
      pr-url:
        description: "PR の URL（PR プレビュー通知用）"
        required: false
        type: string
        default: ""
      pr-head-sha:
        description: "PR のヘッドコミット SHA（pull_request イベントでは github.sha がマージコミットになるため）"
        required: false
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  build:
    name: Build WebGL
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      UNITY_BUILD_OUTPUT_PATH: ${{ inputs.build-output-path }}
    steps:
      - name: Setup Unity project
        id: setup
        uses: void2610/unity-coding-standards/.github/actions/setup-unity-project@main
        with:
          unity-version: ${{ inputs.unity-version }}
          nuget-restore-method: ${{ inputs.nuget-restore-method }}
          nuget-packages-config: ${{ inputs.nuget-packages-config }}

      - name: Optimize WebGL build settings
        if: inputs.optimize-webgl-build-settings
        run: |
          # CI上のWebGLビルド時間と公開ファイルサイズを抑える。
          sed 's/WebGLLinkerTarget: 0/WebGLLinkerTarget: 1/g' ProjectSettings/ProjectSettings.asset > ProjectSettings/ProjectSettings.asset.tmp
          mv ProjectSettings/ProjectSettings.asset.tmp ProjectSettings/ProjectSettings.asset
          sed 's/webGLDecompressionFallback: 0/webGLDecompressionFallback: 1/g' ProjectSettings/ProjectSettings.asset > ProjectSettings/ProjectSettings.asset.tmp
          mv ProjectSettings/ProjectSettings.asset.tmp ProjectSettings/ProjectSettings.asset
          sed 's/webGLCompressionFormat: [0-9]/webGLCompressionFormat: 2/g' ProjectSettings/ProjectSettings.asset > ProjectSettings/ProjectSettings.asset.tmp
          mv ProjectSettings/ProjectSettings.asset.tmp ProjectSettings/ProjectSettings.asset

      - name: Build WebGL
        timeout-minutes: 45
        uses: void2610/unity-coding-standards/.github/actions/unity-webgl-build@main
        with:
          unity-path: ${{ steps.setup.outputs.unity-path }}
          execute-method: ${{ inputs.execute-method }}
          build-output-path: ${{ inputs.build-output-path }}

      - name: Deploy to GitHub Pages
        if: inputs.deploy-method == 'branch'
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: 0
          PUBLISH_BRANCH: ${{ inputs.publish-branch }}
          DESTINATION_DIR: ${{ inputs.destination-dir }}
        run: |
          DEPLOY_WORKTREE="${RUNNER_TEMP}/gh-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "$DEPLOY_WORKTREE"
          if git ls-remote --exit-code --heads "$REMOTE_URL" "$PUBLISH_BRANCH" >/dev/null 2>&1; then
            git clone --depth=1 --single-branch --branch "$PUBLISH_BRANCH" "$REMOTE_URL" "$DEPLOY_WORKTREE"
          else
            mkdir -p "$DEPLOY_WORKTREE"
            git -C "$DEPLOY_WORKTREE" init
            git -C "$DEPLOY_WORKTREE" checkout --orphan "$PUBLISH_BRANCH"
            git -C "$DEPLOY_WORKTREE" remote add origin "$REMOTE_URL"
          fi

          if [ -n "$DESTINATION_DIR" ]; then
            rm -rf "$DEPLOY_WORKTREE/$DESTINATION_DIR"
            mkdir -p "$DEPLOY_WORKTREE/$DESTINATION_DIR"
            cp -R "$UNITY_BUILD_OUTPUT_PATH"/. "$DEPLOY_WORKTREE/$DESTINATION_DIR/"
          else
            cp -R "$UNITY_BUILD_OUTPUT_PATH"/. "$DEPLOY_WORKTREE/"
          fi

          cd "$DEPLOY_WORKTREE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "GitHub Pages に変更はありません。"
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin "HEAD:$PUBLISH_BRANCH"

      # self-hosted の macOS に gtar がある保証が無いので upload-pages-artifact を使わず bsdtar で固める
      - name: Archive Pages artifact
        if: inputs.deploy-method == 'actions'
        env:
          BUILD_OUTPUT_PATH: ${{ inputs.build-output-path }}
          # macOS の tar が拡張属性を ._ ファイルとして混ぜないようにする
          COPYFILE_DISABLE: 1
        run: tar -C "$BUILD_OUTPUT_PATH" -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload Pages artifact
        if: inputs.deploy-method == 'actions'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Compute deploy URL
        if: inputs.deploy-method == 'branch'
        id: deploy-url
        env:
          PAGES_URL_BASE: ${{ inputs.pages-url-base }}
          DESTINATION_DIR: ${{ inputs.destination-dir }}
        run: |
          if [ -n "$PAGES_URL_BASE" ]; then
            if [ -n "$DESTINATION_DIR" ]; then
              URL="${PAGES_URL_BASE}/${DESTINATION_DIR}/"
            else
              URL="${PAGES_URL_BASE}/"
            fi
          else
            URL=""
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: inputs.deploy-method == 'branch'
        uses: void2610/unity-coding-standards/.github/actions/notify-discord@main
        with:
          discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          deploy-url: ${{ steps.deploy-url.outputs.url }}
          commit-sha: ${{ inputs.pr-head-sha || github.sha }}
          pr-number: ${{ inputs.pr-number }}
          pr-title: ${{ inputs.pr-title }}
          pr-url: ${{ inputs.pr-url }}

  deploy:
    name: Deploy to GitHub Pages
    if: inputs.deploy-method == 'actions'
    needs: build
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 15
        uses: actions/deploy-pages@v5

      - name: Notify Discord
        uses: void2610/unity-coding-standards/.github/actions/notify-discord@main
        with:
          discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          deploy-url: ${{ inputs.pages-url-base && format('{0}/', inputs.pages-url-base) || steps.deployment.outputs.page_url }}
          commit-sha: ${{ inputs.pr-head-sha || github.sha }}
          pr-number: ${{ inputs.pr-number }}
          pr-title: ${{ inputs.pr-title }}
          pr-url: ${{ inputs.pr-url }}
