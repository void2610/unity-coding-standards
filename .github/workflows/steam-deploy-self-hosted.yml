name: Shared Steam Deploy (Self-Hosted)

on:
  workflow_call:
    inputs:
      unity-version:
        description: "Unity Editor のバージョン（例: 6000.3.10f1）"
        required: true
        type: string
      runner-labels:
        description: "self-hosted runner のラベル配列（JSON 形式、例: [\"self-hosted\",\"macOS\"]）"
        required: true
        type: string
      windows-execute-method:
        description: "Windows ビルド用の -executeMethod に渡す完全修飾名（例: CiBuild.BuildWindows）"
        required: true
        type: string
      mac-execute-method:
        description: "Mac ビルド用の -executeMethod に渡す完全修飾名（例: CiBuild.BuildMac）"
        required: true
        type: string
      root-path:
        description: "Steam depot のコンテンツルート（CiBuild が出力するディレクトリの親）"
        required: false
        type: string
        default: builds
      windows-depot-name:
        description: "Windows depot のサブディレクトリ名"
        required: false
        type: string
        default: StandaloneWindows64
      mac-depot-name:
        description: "Mac depot のサブディレクトリ名"
        required: false
        type: string
        default: StandaloneOSX
      release-branch:
        description: "Steam のリリースブランチ（test / staging / production など）"
        required: false
        type: string
        default: test
      nuget-restore-method:
        description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列でスキップ）"
        required: false
        type: string
        default: ""
      nuget-packages-config:
        description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
        required: false
        type: string
        default: Assets/packages.config
    secrets:
      STEAM_USERNAME:
        required: true
      STEAM_CONFIG_VDF:
        required: true
      STEAM_APP_ID:
        required: true

jobs:
  steam-deploy:
    # build と deploy を単一ジョブで完結させる。別ジョブに分けると
    # artifact upload/download が self-hosted → GitHub Azure Blob → self-hosted
    # と往復して 30 分近くのロスになるため。
    name: Build & Deploy to Steam
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 90
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
    steps:
      - name: Setup Unity project
        id: setup
        uses: void2610/unity-coding-standards/.github/actions/setup-unity-project@main
        with:
          unity-version: ${{ inputs.unity-version }}
          nuget-restore-method: ${{ inputs.nuget-restore-method }}
          nuget-packages-config: ${{ inputs.nuget-packages-config }}

      - name: Generate version string
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # チェックアウトなしで git ls-remote でタグ一覧だけ取得する。
          base_version="$(git ls-remote --tags --sort=-version:refname \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            | grep -v '\^{}' | head -n1 | sed 's|.*refs/tags/||')"
          base_version="${base_version:-0.0.0}"
          date_jst="$(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M:%S')"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          full_version="${base_version} ${date_jst} ${short_sha}"
          echo "buildVersion=${full_version}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${full_version}"

      - name: Build Windows
        timeout-minutes: 45
        env:
          UNITY_PATH: ${{ steps.setup.outputs.unity-path }}
          BUILD_VERSION: ${{ steps.version.outputs.buildVersion }}
        run: |
          rm -f Temp/UnityLockfile
          "$UNITY_PATH" \
            -batchmode \
            -quit \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget StandaloneWindows64 \
            -executeMethod "${{ inputs.windows-execute-method }}" \
            -logFile -

      - name: Build Mac
        timeout-minutes: 45
        env:
          UNITY_PATH: ${{ steps.setup.outputs.unity-path }}
          BUILD_VERSION: ${{ steps.version.outputs.buildVersion }}
        run: |
          rm -f Temp/UnityLockfile
          "$UNITY_PATH" \
            -batchmode \
            -quit \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget StandaloneOSX \
            -executeMethod "${{ inputs.mac-execute-method }}" \
            -logFile -

      - name: Deploy to Steam
        uses: void2610/unity-coding-standards/.github/actions/steamcmd-deploy@main
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          config-vdf: ${{ secrets.STEAM_CONFIG_VDF }}
          app-id: ${{ secrets.STEAM_APP_ID }}
          root-path: ${{ inputs.root-path }}
          windows-depot-name: ${{ inputs.windows-depot-name }}
          mac-depot-name: ${{ inputs.mac-depot-name }}
          release-branch: ${{ inputs.release-branch }}
          build-description: "auto deploy via github actions (${{ steps.version.outputs.buildVersion }})"
