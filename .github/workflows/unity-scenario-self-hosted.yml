name: Shared Unity Scenario (Self-Hosted)

# LiminalPalette の [ConsoleScenario] を Unity batch mode で実行する reusable workflow。
# 呼び出し側リポは -executeMethod として呼ばれる Runner を Editor 配下に持つ必要がある
# (例: ApocalypticApartmentHunting.Editor.CI.CiScenarioRunner.Run)。
#
# Runner は Environment.GetCommandLineArgs() から `-scenarios "A;B;C"` を読み取り、
# シナリオを順に実行して全件パスなら EditorApplication.Exit(0)、1 件でも失敗で Exit(1) する責務を持つ。
# 仕様の詳細は呼び出し側リポの `Documentation~/scenarios.md` を参照。

on:
  workflow_call:
    inputs:
      job-name:
        required: false
        type: string
        default: シナリオ実行
      unity-version:
        required: true
        type: string
      runner-labels:
        description: "self-hosted runner のラベル配列（JSON 形式、例: [\"self-hosted\",\"macos\"]）"
        required: true
        type: string
      execute-method:
        description: "-executeMethod に渡す Runner の完全修飾メソッド名（例: ApocalypticApartmentHunting.Editor.CI.CiScenarioRunner.Run）"
        required: true
        type: string
      scenarios:
        description: "実行するシナリオ Path の \";\" 区切り文字列（例: Ci/Smoke;Player/Scenario/HealthSmoke）"
        required: true
        type: string
      artifact-name:
        required: false
        type: string
        default: scenario-log
      pr-number:
        required: false
        type: number
        default: 0
      nuget-restore-method:
        description: "NuGet 復元用の -executeMethod に渡す完全修飾メソッド名（空文字列で復元ステップをスキップ）"
        required: false
        type: string
        default: ""
      nuget-packages-config:
        description: "packages.config のパス（ハッシュ比較で復元スキップ判定に使用）"
        required: false
        type: string
        default: Assets/packages.config

# 同一 PR / ブランチで新しい push が来たら走行中・キュー待ちの古い run をキャンセルする。
# main / develop への直接 push はキャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scenario:
    name: ${{ inputs.job-name }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      SCENARIO_LOG_PATH: CIBuilds/scenario-log.txt
    steps:
      - name: Setup Unity project
        id: setup
        uses: void2610/unity-coding-standards/.github/actions/setup-unity-project@main
        with:
          unity-version: ${{ inputs.unity-version }}
          nuget-restore-method: ${{ inputs.nuget-restore-method }}
          nuget-packages-config: ${{ inputs.nuget-packages-config }}

      - name: Run scenarios
        env:
          UNITY_PATH: ${{ steps.setup.outputs.unity-path }}
          EXECUTE_METHOD: ${{ inputs.execute-method }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          # Runner は EditorApplication.Exit(0/1) で終了する想定。
          # batch mode の Unity は通常 0=成功 / 1=失敗 を返すが、Runner 側の例外で
          # 別コードを返す可能性もあるため、明示的に code 0 のみ成功扱いにする。
          mkdir -p "$(dirname "$SCENARIO_LOG_PATH")"
          EXIT_CODE=0
          "$UNITY_PATH" \
            -batchmode \
            -quit \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod "$EXECUTE_METHOD" \
            -scenarios "$SCENARIOS" \
            -logFile "$GITHUB_WORKSPACE/$SCENARIO_LOG_PATH" || EXIT_CODE=$?

          # Unity のフルログは長いので、Runner が出した `[CiScenarioRunner]` 行と
          # 末尾の summary 行だけ標準出力に reflowed して CI ログを読みやすくする。
          # ログファイル全体は artifact としてアップロードする。
          echo "::group::Runner output"
          grep -E "\[(Ci|Liminal)" "$GITHUB_WORKSPACE/$SCENARIO_LOG_PATH" || true
          echo "::endgroup::"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "All scenarios passed."
          else
            echo "::error::Scenario run failed (Unity exit code $EXIT_CODE)"
            # Unity ログ末尾の 50 行だけ stderr に流す (artifact を見ないでも原因が分かるように)
            echo "::group::Last 50 lines of Unity log"
            tail -n 50 "$GITHUB_WORKSPACE/$SCENARIO_LOG_PATH" || true
            echo "::endgroup::"
            exit "$EXIT_CODE"
          fi

      - name: Upload Unity log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.SCENARIO_LOG_PATH }}

      - name: Comment scenario results on PR
        if: ${{ always() && inputs.pr-number > 0 }}
        uses: actions/github-script@v7
        env:
          SCENARIO_LOG_PATH: ${{ env.SCENARIO_LOG_PATH }}
          SCENARIOS: ${{ inputs.scenarios }}
          PR_NUMBER: ${{ inputs.pr-number }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- liminal-palette-scenario-results -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const scenarios = (process.env.SCENARIOS || '')
              .split(';')
              .map(s => s.trim())
              .filter(Boolean);
            const status = process.env.JOB_STATUS;
            const logPath = process.env.SCENARIO_LOG_PATH;

            // Runner が出した "[CiScenarioRunner]" 接頭辞行だけ抜き出して PR コメントに埋める。
            // Unity の ASCII コントロール文字や rich text は除外。
            let runnerLines = [];
            if (fs.existsSync(logPath)) {
              const text = fs.readFileSync(logPath, 'utf8');
              runnerLines = text.split('\n').filter(line => line.includes('[CiScenarioRunner]'));
            }

            const escapeMd = (s) => s.replace(/`/g, '\\`');
            const summaryIcon = status === 'success' ? '✅' : '❌';
            const body = [
              marker,
              `## Scenario CI ${summaryIcon}`,
              '',
              `**Status**: ${status}`,
              `**Scenarios**: ${scenarios.length} 件`,
              ...scenarios.map(s => `- \`${s}\``),
              '',
              runnerLines.length > 0
                ? '<details><summary>Runner output</summary>\n\n```\n' +
                  runnerLines.map(escapeMd).join('\n') +
                  '\n```\n\n</details>'
                : '',
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
